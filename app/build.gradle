apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'mm.pndaza.tipitakamyanmar'
    compileSdk 36
    defaultConfig {
        applicationId "mm.pndaza.tipitakamyanmar"
        minSdk 23
        targetSdk 36
        versionCode 22
        versionName "21.08.2026"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation 'com.google.android.material:material:1.14.0'
//    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.activity:activity:1.13.0"
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.23.1'


//    implementation 'org.adw.library:discrete-seekbar:1.0.1'
    implementation 'com.github.phonghoang1023:DiscreteSeekBar:1.1'
    implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'androidx.core:core-ktx:1.18.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
